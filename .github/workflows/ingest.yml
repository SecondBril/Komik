name: Auto-Sync Comic Catalog & Chapters

on:
  schedule:
     - cron: "0 17 * * *" # Berjalan 1x sehari (pukul 00:00 WIB)
  workflow_dispatch:
    inputs:
      mode:
        description: 'Pilih Mode Eksekusi'
        type: choice
        options:
          - 'quick'          # Quick Sync (Halaman 1-5) + Quick Repair (~3-5 menit)
          - 'full_sync'      # 20 Runner Paralel: Sync 270 Halaman Katalog (~10-15 menit)
          - 'repair_all'     # 20 Runner Paralel: Perbaiki Seluruh Gambar Komik di Database (Auto-Continue jika belum selesai)
          - 'repair_single'  # Repair 1 komik spesifik berdasarkan slug
        default: 'quick'
      comic_slug:
        description: 'Slug komik spesifik (hanya jika mode repair_single)'
        required: false
        default: ''
      max_chapters_per_comic:
        description: 'Batas chapter per komik untuk repair (0 = semua chapter, misal: 10 untuk 10 ch terbaru)'
        required: false
        default: '0'
      reset_checkpoints:
        description: 'Reset checkpoint ke 0 (Mulai perbaikan dari awal database)'
        type: boolean
        required: false
        default: false
      continuation_run:
        description: 'Nomor run lanjutan (Internal counter untuk auto-trigger)'
        required: false
        default: '0'
  push:
    branches:
      - main

permissions:
  contents: write
  actions: write

jobs:
  # ====================================================================
  # JOB 1: QUICK SYNC (Halaman 1-5)
  # Berjalan otomatis setiap 2 jam, push, atau saat mode 'quick'
  # Selesai hanya dalam 2-4 menit!
  # ====================================================================
  quick-sync:
    name: Quick Sync (Pages 1-5)
    if: ${{ github.event_name == 'schedule' || github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.mode == 'quick') }}
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Google Chrome Headless
        uses: browser-actions/setup-chrome@v1
        id: setup-chrome

      - name: Install Dependencies
        run: npm ci

      - name: Run Quick Sync (Pages 1-5)
        run: npx tsx scripts/sync-catalog-cli.mjs 1 5
        env:
          PUPPETEER_EXECUTABLE_PATH: ${{ steps.setup-chrome.outputs.chrome-path }}
          CHROME_BIN: ${{ steps.setup-chrome.outputs.chrome-path }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL || secrets.SUPABASE_URL }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL || secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
          START_PAGE: "1"
          END_PAGE: "5"

  # ====================================================================
  # JOB 2: MATRIX FULL SYNC (20 RUNNER PARALEL: Halaman 1-270)
  # 20 runner berjalan serentak, masing-masing hanya menangani ~13-14 halaman!
  # Selesai dalam ~10-15 menit!
  # ====================================================================
  matrix-full-sync:
    name: Sync Shard ${{ matrix.shard.id }}/20 (P${{ matrix.shard.start }}-${{ matrix.shard.end }})
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.mode == 'full_sync' }}
    runs-on: ubuntu-latest
    timeout-minutes: 360

    strategy:
      fail-fast: false
      matrix:
        shard:
          - { id: 1, start: 1, end: 14 }
          - { id: 2, start: 15, end: 28 }
          - { id: 3, start: 29, end: 42 }
          - { id: 4, start: 43, end: 56 }
          - { id: 5, start: 57, end: 70 }
          - { id: 6, start: 71, end: 84 }
          - { id: 7, start: 85, end: 98 }
          - { id: 8, start: 99, end: 112 }
          - { id: 9, start: 113, end: 126 }
          - { id: 10, start: 127, end: 140 }
          - { id: 11, start: 141, end: 154 }
          - { id: 12, start: 155, end: 168 }
          - { id: 13, start: 169, end: 182 }
          - { id: 14, start: 183, end: 196 }
          - { id: 15, start: 197, end: 210 }
          - { id: 16, start: 211, end: 224 }
          - { id: 17, start: 225, end: 238 }
          - { id: 18, start: 239, end: 250 }
          - { id: 19, start: 251, end: 260 }
          - { id: 20, start: 261, end: 270 }

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Google Chrome Headless
        uses: browser-actions/setup-chrome@v1
        id: setup-chrome

      - name: Install Dependencies
        run: npm ci

      - name: Run Shard Sync (Pages ${{ matrix.shard.start }}-${{ matrix.shard.end }})
        run: npx tsx scripts/sync-catalog-cli.mjs ${{ matrix.shard.start }} ${{ matrix.shard.end }}
        env:
          PUPPETEER_EXECUTABLE_PATH: ${{ steps.setup-chrome.outputs.chrome-path }}
          CHROME_BIN: ${{ steps.setup-chrome.outputs.chrome-path }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL || secrets.SUPABASE_URL }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL || secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
          START_PAGE: ${{ matrix.shard.start }}
          END_PAGE: ${{ matrix.shard.end }}

  # ====================================================================
  # JOB 3: MATRIX REPAIR ALL (20 RUNNER PARALEL UNTUK PERBAIKAN GAMBAR)
  # Membagi seluruh komik di database ke 20 runner secara bersamaan!
  # Dilengkapi checkpoint otomatis di Turso & batas waktu aman (5 jam).
  # ====================================================================
  matrix-repair-images:
    name: Repair Shard ${{ matrix.shard.id }}/20
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.mode == 'repair_all' }}
    runs-on: ubuntu-latest
    timeout-minutes: 360

    strategy:
      fail-fast: false
      matrix:
        shard:
          - { id: 1, index: 0 }
          - { id: 2, index: 1 }
          - { id: 3, index: 2 }
          - { id: 4, index: 3 }
          - { id: 5, index: 4 }
          - { id: 6, index: 5 }
          - { id: 7, index: 6 }
          - { id: 8, index: 7 }
          - { id: 9, index: 8 }
          - { id: 10, index: 9 }
          - { id: 11, index: 10 }
          - { id: 12, index: 11 }
          - { id: 13, index: 12 }
          - { id: 14, index: 13 }
          - { id: 15, index: 14 }
          - { id: 16, index: 15 }
          - { id: 17, index: 16 }
          - { id: 18, index: 17 }
          - { id: 19, index: 18 }
          - { id: 20, index: 19 }

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Google Chrome Headless
        uses: browser-actions/setup-chrome@v1
        id: setup-chrome

      - name: Install Dependencies
        run: npm ci

      - name: Run Distributed Shard Repair
        run: node scripts/repair-missing-pages.mjs
        env:
          PUPPETEER_EXECUTABLE_PATH: ${{ steps.setup-chrome.outputs.chrome-path }}
          CHROME_BIN: ${{ steps.setup-chrome.outputs.chrome-path }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL || secrets.SUPABASE_URL }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL || secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
          SHARD_INDEX: ${{ matrix.shard.index }}
          TOTAL_SHARDS: "20"
          MAX_CHAPTERS_PER_COMIC: ${{ inputs.max_chapters_per_comic }}
          MAX_RUNTIME_MINUTES: "300" # 5 jam: Berhenti & simpan checkpoint sebelum batas 6 jam GitHub
          RESET_CHECKPOINTS: ${{ inputs.reset_checkpoints == true && 'true' || 'false' }}
          GITHUB_RUN_ID: ${{ github.run_id }}

  # ====================================================================
  # JOB 4: COORDINATOR & AUTO-CONTINUE (AUTO-RETRIGGER RUN BERIKUTNYA)
  # Memeriksa tabel checkpoint di Turso. Jika masih ada shard yang belum
  # selesai (karena batas waktu), memicu workflow_dispatch berikutnya!
  # ====================================================================
  coordinate-repair-continuation:
    name: Auto-Continue Checker (Auto-Retrigger)
    needs: [matrix-repair-images]
    if: ${{ always() && (inputs.mode == 'repair_all') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Check Repair Shards Status
        id: check-status
        run: node scripts/check-action-status.mjs repair_images 20
        env:
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}

      - name: Trigger Next Action Run If Incomplete
        if: ${{ steps.check-status.outputs.needs_continuation == 'true' }}
        run: |
          CURRENT_RUN="${{ inputs.continuation_run || '0' }}"
          NEXT_RUN=$((CURRENT_RUN + 1))
          MAX_RUNS=20

          echo "=========================================================="
          echo "📊 Sesi saat ini: Sesi ke-$CURRENT_RUN"
          echo "🔄 Sesi berikutnya yang akan dipicu: Sesi ke-$NEXT_RUN"
          echo "=========================================================="

          if [ "$NEXT_RUN" -gt "$MAX_RUNS" ]; then
            echo "⚠️ Telah mencapai batas maksimum auto-trigger ($MAX_RUNS kali). Loop dihentikan demi keamanan."
            exit 0
          fi

          echo "🚀 Memicu sesi GitHub Action lanjutan secara otomatis..."

          GH_TOKEN="${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}"
          export GH_TOKEN

          gh workflow run ingest.yml \
            --ref "${{ github.ref_name }}" \
            -f mode="repair_all" \
            -f max_chapters_per_comic="${{ inputs.max_chapters_per_comic || '0' }}" \
            -f reset_checkpoints="false" \
            -f continuation_run="$NEXT_RUN"

          echo "✅ Sesi lanjutan ke-$NEXT_RUN berhasil dipicu di GitHub Actions!"

  # ====================================================================
  # JOB 5: QUICK REPAIR & REPAIR SINGLE
  # Berjalan saat cron rutin (dibatasi 30 komik terbaru), atau single slug
  # ====================================================================
  quick-repair:
    name: Quick / Single Comic Image Repair
    if: ${{ github.event_name == 'schedule' || github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && (inputs.mode == 'quick' || inputs.mode == 'repair_single')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Google Chrome Headless
        uses: browser-actions/setup-chrome@v1
        id: setup-chrome

      - name: Install Dependencies
        run: npm ci

      - name: Run Quick / Single Repair
        run: node scripts/repair-missing-pages.mjs ${{ inputs.comic_slug }}
        env:
          PUPPETEER_EXECUTABLE_PATH: ${{ steps.setup-chrome.outputs.chrome-path }}
          CHROME_BIN: ${{ steps.setup-chrome.outputs.chrome-path }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL || secrets.SUPABASE_URL }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL || secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
          REPAIR_LIMIT: ${{ inputs.mode == 'repair_single' && '1' || '30' }}
          MAX_CHAPTERS_PER_COMIC: ${{ inputs.mode == 'repair_single' && (inputs.max_chapters_per_comic || '0') || (inputs.max_chapters_per_comic != '' && inputs.max_chapters_per_comic != '0' && inputs.max_chapters_per_comic || '15') }}
