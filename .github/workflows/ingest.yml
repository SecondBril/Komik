name: Auto-Sync Comic Catalog & Chapters

on:
  schedule:
    - cron: "0 */2 * * *" # Berjalan otomatis setiap 2 jam
  workflow_dispatch: {}     # Dukungan trigger manual dari menu Actions di GitHub
  push:
    branches:
      - main

jobs:
  sync-catalog:
    name: Sync Comic Metadata & New Chapters
    runs-on: ubuntu-latest
    timeout-minutes: 360 # Cepat dan efisien karena TIDAK menyimpan gambar ke database

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Google Chrome Headless
        uses: browser-actions/setup-chrome@v1
        id: setup-chrome

      - name: Install Dependencies
        run: npm ci

      - name: Run Auto-Sync Catalog & Real Chapter Images
        run: npm run sync-comics
        env:
          PUPPETEER_EXECUTABLE_PATH: ${{ steps.setup-chrome.outputs.chrome-path }}
          CHROME_BIN: ${{ steps.setup-chrome.outputs.chrome-path }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL || secrets.SUPABASE_URL }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL || secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SYNC_MAX_PAGES: "300"
