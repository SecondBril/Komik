name: Auto-Sync Comic Catalog & Chapters

on:
  schedule:
    - cron: "0 */2 * * *" # Berjalan otomatis setiap 2 jam
  workflow_dispatch:
    inputs:
      comic_slug:
        description: 'Slug komik spesifik untuk diperbaiki (kosongkan jika ingin auto-repair komik yang belum lengkap)'
        required: false
        default: ''
      repair_only:
        description: 'Hanya jalankan repair gambar chapter (lewati sync catalog)?'
        type: boolean
        default: false
  push:
    branches:
      - main

jobs:
  sync-catalog:
    name: Sync Comic Metadata & Real Chapter Images
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Google Chrome Headless
        uses: browser-actions/setup-chrome@v1
        id: setup-chrome

      - name: Install Dependencies
        run: npm ci

      - name: Run Auto-Sync Catalog & New Chapters
        if: ${{ !inputs.repair_only }}
        run: npm run sync-comics
        env:
          PUPPETEER_EXECUTABLE_PATH: ${{ steps.setup-chrome.outputs.chrome-path }}
          CHROME_BIN: ${{ steps.setup-chrome.outputs.chrome-path }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL || secrets.SUPABASE_URL }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL || secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SYNC_MAX_PAGES: "300"

      - name: Run Auto-Repair Missing Chapter Pages
        run: node scripts/repair-missing-pages.mjs ${{ github.event.inputs.comic_slug || '' }}
        env:
          PUPPETEER_EXECUTABLE_PATH: ${{ steps.setup-chrome.outputs.chrome-path }}
          CHROME_BIN: ${{ steps.setup-chrome.outputs.chrome-path }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL || secrets.SUPABASE_URL }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL || secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          REPAIR_LIMIT: "30"
